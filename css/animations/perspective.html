<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <style>
      .scene {
        perspective: 16px;
        width: 150px;
        height: 150px;
      }
      .card{
        width: 100%;
        height: 100%;
        background: blue;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform .9s;
        transform-style: preserve-3d;
      }
      .card:hover{
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="card">
        3D
        <h1>3D</h1>
      </div>
    </div>
  </body>
</html>
