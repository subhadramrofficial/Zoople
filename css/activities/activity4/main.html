<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadpool UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="left-section">
        

        <div class="left-content">
          <p class="small-text">#1 MOVIE IN THE WORLD</p>

          <h1>
            WATCH NEW <br />
            <span>DEADPOOL 2</span> <br />
            ONLINE
          </h1>

          <button class="buy-btn">BUY ACCESS →</button>
        </div>
      </div>

      <div class="middle">
        <img src="deadpool.png" alt="" />
      </div>

      <div class="right-section">

        <nav class="navbar">
          <a href="#">About</a>
          <a href="#">Get Tickets</a>
          <a href="#">Videos</a>
          <a href="#">Share</a>
        </nav>

        <div class="card top-card">
          <div class="card-text">
            <span>20TH CENTURY FOX</span>

            <h3>Behind the Scenes: Deadpool's Iconic Gunfight Moment</h3>
          </div>

          <img src="deadpool1.jpg" alt="" />
        </div>

        <div class="card bottom-card">
          <img src="deadpool2.jpg" alt="" />

          <div class="stats">
            <h2>33,701,311</h2>

            <p>VIEWERS</p>

            <h3>⭐⭐⭐⭐⭐ 4.8</h3>

            <a href="#">MORE →</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
