<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Elements</title>
    <link rel="stylesheet" href="pseudo.css">
</head>
<body>
    <div class="hello">
        <h1>Hello World</h1>
        <input type="text">
        <ul>
            <li>Monday</li>
            <li>Tuesday</li>
            <li>Wednesday</li>
            <li>Thursday</li>
            <li class="green">Friday</li>
            <li class="red">Saturday</li>
            <li>Sunday</li>
        </ul>
    </div>
    <div class="days">
        <h3>Days and Weeks</h3>
    </div>
</body>
</html>
