<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background images</title>
    <style>
      div {
        text-align: center;
        border-radius: 10px;
        padding: 40px;
        color: white;
        font-size: large;
        margin: 10px;
      }
      .shadow{
         box-shadow: 4px 4px 10px rgba(58, 56, 56,0.5);
      }
    </style>
  </head>
  <body>
    <center>
      <h1><b>Background Properties</b></h1>
    </center>
    <section>
      <div style="background-color: #3498db">Background Color</div>
      <div
        style="
          background-image: url(img3.jpg);
          background-size: cover;
          background-position: center;
        "
      >
        Background Image
      </div>
      <div
        style="
          background-image: url(img5.webp);
          background-repeat: repeat;
          background-size: 100px;
        "
      >
        Background Repeat
      </div>
      <div
        style="
          background-image: url(img1.jpg);
          background-repeat: no-repeat;
          background-size: contain;
          background-position: right center;
        "
      >
        Background Position & Size
      </div>
      <div
        style="
          background-image: url(img2.jpg);
          background-attachment: fixed;
          background-size: cover;
          background-position: center;
        "
      >
        Background Attachment (Fixed)
      </div>
    </section>
    <section>
      <center>
        <h1>Gradients</h1>
      </center>
      <div
        style="
          background: linear-gradient(60deg, rgb(0, 0, 0), rgb(205, 202, 202));
        "
      >
        Linear Gradient
      </div>
      <div
        class="shadow"
        style="
          background: radial-gradient(circle, rgb(128, 0, 128), rgb(255, 0, 0));
        "
      >
        Radial Gradient
      </div><center>
      <p style="font-size: 70px; color:
      black; text-shadow: 2px 2px 2px red" >
Text Shadow</center>
      </p>
    </section>
  </body>
</html>
