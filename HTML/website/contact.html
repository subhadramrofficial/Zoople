<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | My Website</title>
    <link rel="icon" type="image/jpg" href="images/icon.jpg" />
  </head>
  <body>
    <header>
      <h1>Contact Us</h1>
      <nav>
        <a href="home.html">Home</a> | 
        <a href="about.html">About</a> |
        <a href="gallery.html">Gallery</a> |
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <main>
      <aside>
        <h3>Get in Touch</h3>
      </aside>
      <form bindsubmit="">
        <fieldset>
          <legend>Contact Form</legend>
          <label for="name">Full Name:</label> <br />
          <input
            type="text"
            placeholder="Enter you name"
            id="name"
            name="name"
          />
          <br /><br />
          <label for="email">Email:</label> <br />
          <input
            type="email"
            placeholder="your@example.com"
            id="email"
            name="email"
          />
          <br /><br />
          <label for="contact">Phone:</label> <br />
          <input
            type="phone"
            placeholder="Enter phone number"
            id="phone"
            name="phone"
          />
          <br /><br />
          <label for="reason">Contact Reason:</label> <br /><br />
          <input type="radio" name="reason" value="feedback" id="feedback" />
          Feedback
          <input type="radio" name="reason" value="support" id="support" />
          Support <br /><br />
          <label for="updates">Subscribe to my updates:</label> <br /><br />
          <input type="checkbox" name="updates" value="updates" /> Yes, send me
          updates <br /><br />
          <label for="message">Message:</label><br />
          <input
            type="textarea"
            placeholder="Write your response"
            style="width: 300px; height: 100px"
            id="message"
            name="message"
          />
          <br /><br />
          <input type="button" value="Send" />
        </fieldset>
      </form>
    </main>
    <footer>
      <p>&copy; 2025 My Website</p>
    </footer>
  </body>
</html>
