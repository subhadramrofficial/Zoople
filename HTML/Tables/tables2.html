<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>
  </head>
  <body>
    <h1>Table Rowspan</h1>
    <table border="1">
      <tr>
        <th>Name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Ajay</td>
        <td rowspan="2">24</td>
      </tr>
      <tr>
        <td>Priya</td>
      </tr>
    </table>
    <h1>Table with Colspan</h1>
    <table border="1">
      <tr>
        <th>Name</th>
        <th>Expense</th>
      </tr>
      <tr>
        <td>Arun</td>
        <td>$10</td>
      </tr>
      <tr>
        <td>Priya</td>
        <td>$8</td>
      </tr>
      <tr>
        <td colspan="2">Sum: $18</td>
      </tr>
    </table>
  </body>
</html>
