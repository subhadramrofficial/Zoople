<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Tables</h1>
    <h2>Tables Example: Favorite Books</h2>
   
    <table border="1" >
        <caption> My Favorite Books</caption>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
        </tr>
        <tr>
            <td>The Alchemist</td>
            <td>Poaulo Coelho</td>
            <td>1988</td>
        </tr>
        <tr>
            <td>1984</td>
            <td>George Orwell</td>
            <td>1949</td>
        </tr>
        <tr>
            <td>Harry Potter Series</td>
            <td>JK Rowling</td>
            <td>1997</td>
        </tr>
    </table>

</body>
</html>
