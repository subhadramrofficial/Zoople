<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
  </head>
  <body>
    <h1>Contact Us Form</h1>
    <form bindsubmit="">
      <fieldset>
        <legend>Conatct Us</legend>
        <label for="name">Full Name:</label><br />
        <input type="text" placeholder="Enter you name" name="name" id="name" />
        <br /><br />
        <label for="email">Email:</label><br />
        <input
          type="email"
          placeholder="your@gmail.com"
          id="email"
          name="email"
        /><br /><br />
        <label for="pass">Password(for registered users):</label><br />
        <input
          type="password"
          placeholder="Enter your password"
          id="pass"
          name="pass"
        />
        <br /><br />
        <label for="contact">Phone Number:</label> <br />
        <input
          type="phone"
          placeholder="Enter your phone number"
          id="contact"
          name="contact"
        />
        <br /><br />
        <label for="date">Preferred Contact Date:</label> <br />
        <input type="date" id="date" /> <br /><br />
        <br />
        <label for="referal">How did you hear about us?</label> <br /><br />
        <input type="radio" name="referal" id="social" value="Social Media" />
        Social Media <br />
        <input type="radio" name="referal" id="friend" value="Friend" /> Friend
        <br />
        <input
          type="radio"
          name="referal"
          id="advertisment"
          value="Advertisement"
        />
        Advertisement <br /><br />

        <label for="topics">Topics you are Interested in:</label> <br /><br />
        <input type="checkbox" name="topics" value="Web Development" /> Web
        Development <br />
        <input type="checkbox" name="topics" value="Design" /> Design <br />
        <input type="checkbox" name="topics" value="Marketing" /> Marketing
        <br /><br />
        <label for="file">Attach a file(optional):</label> <br />
        <input type="file" id="file" name="file" /> <br /><br />
        <label for="reason">Reason for contact:</label> <br />
        <select name="reasons" id="">
          <option value="">--Select a reason--</option>
          <option value="general_inquiry">General Inquiry</option>
          <option value="support">Support</option>
          <option value="feedback">Feedback</option></select
        ><br /><br />
        <label for="message">Your Message:</label> <br />
        <input
          type="textarea"
          id="message"
          placeholder="Write your message here..."
          name="message"
          style="width: 300px; height: 100px"
        /><br /><br />
        <label for="terms">
          <input type="checkbox" id="terms" name="terms" />
          I agree to your terms and conditions
        </label>
        <br /><br />
        <input type="button" value="Submit" />
      </fieldset>
    </form>
  </body>
</html>
