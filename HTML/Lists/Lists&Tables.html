<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists & Tables</title>
  </head>
  <body>
    <h1>My weekly schedule</h1>
    <h2>To-Do List</h2>
    <ul>
      <li>Monday</li>
      <ol>
        <li>Math</li>
        <li>English</li>
      </ol>
      <li>Tuesday</li>
      <ol>
        <li>Geography</li>
        <li>History</li>
      </ol>
    </ul>
    <h2>Schedule Table</h2>
    <table border="1">
      <caption>
        Weekly Routine
      </caption>
      <tr>
        <th>Day</th>
        <th>Morning</th>
        <th>Afternoon</th>
        <th>Evening</th>
      </tr>
      <tr>
        <td rowspan="2">Monday & Tuesday</td>
        <td><a href="https://share.google/Rg7EdtSwiar3RWylF" target="_blank">Math</a></td>
        <td>English</td>
        <td>Basketball</td>
      </tr>
      <tr>
        <td>Science</td>
        <td>Art</td>
        <td>Music</td>
      </tr>
      <tr>
        <td>Wednesday</td>
        <td colspan="2">Project Work ( Morning + Afternoon )</td>
        <td>Dance</td>
      </tr>
    </table>
  </body>
</html>
