<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio & Video</title>
</head>
<body>
    <h1>Audio Example</h1>
    <audio controls>
        <source src="music.mp3" type="audio/mp3">
        Your browser does not support the audio tag.
    </audio>
    <hr>
    <h2>Video Example</h2>
    <video width="400" height="400" controls>
        <source src="./From S04E02 1080p 10bit WEBRip 6CH x265 HEVC-PSA.mkv" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <h2>Embedding youtube videos</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/MZWina8plDk?si=k24rZFA3-qGyEVOq" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
